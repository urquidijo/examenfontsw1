<div class="min-h-screen bg-slate-100">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Diseñar flujo de trabajo</h1>
        <p class="text-sm text-slate-500">Proyecto: {{ projectId }}</p>
      </div>

      <div class="flex gap-3">
        <button
          (click)="goBack()"
          class="rounded-2xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50"
        >
          Volver
        </button>

        <button
          (click)="saveWorkflow()"
          [disabled]="saving || loading"
          class="rounded-2xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-60"
        >
          {{ saving ? 'Guardando...' : 'Guardar flujo' }}
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-8">
    <div class="grid gap-6 lg:grid-cols-[280px_1fr]">
      <aside class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <h2 class="text-lg font-bold text-slate-800">Nodos</h2>
        <p class="mt-1 text-sm text-slate-500">
          Agrega nodos y conéctalos arrastrando desde sus puertos.
        </p>

        <div class="mt-5 space-y-3">
          <button
            (click)="addStartNode()"
            [disabled]="loading"
            class="w-full rounded-2xl border border-green-200 bg-green-50 px-4 py-3 text-left text-sm font-semibold text-green-700 hover:bg-green-100 disabled:opacity-60"
          >
            + Inicio
          </button>

          <button
            (click)="addTaskNode()"
            [disabled]="loading"
            class="w-full rounded-2xl border border-blue-200 bg-blue-50 px-4 py-3 text-left text-sm font-semibold text-blue-700 hover:bg-blue-100 disabled:opacity-60"
          >
            + Actividad
          </button>

          <button
            (click)="addDecisionNode()"
            [disabled]="loading"
            class="w-full rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-left text-sm font-semibold text-amber-700 hover:bg-amber-100 disabled:opacity-60"
          >
            + Decisión
          </button>

          <button
            (click)="addEndNode()"
            [disabled]="loading"
            class="w-full rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-left text-sm font-semibold text-red-700 hover:bg-red-100 disabled:opacity-60"
          >
            + Fin
          </button>
        </div>

        <div class="mt-6 rounded-2xl bg-slate-50 p-4 text-sm text-slate-600">
          Usa <span class="font-semibold">Delete</span> o
          <span class="font-semibold">Backspace</span> para eliminar el nodo seleccionado.
        </div>

        <div
          *ngIf="message"
          class="mt-4 rounded-2xl border border-green-200 bg-green-50 px-4 py-3 text-sm text-green-700"
        >
          {{ message }}
        </div>

        <div
          *ngIf="errorMessage"
          class="mt-4 rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
        >
          {{ errorMessage }}
        </div>
      </aside>

      <section class="relative rounded-3xl border border-slate-200 bg-white p-3 shadow-sm">
        <div
          *ngIf="loading"
          class="absolute inset-0 z-10 flex items-center justify-center rounded-3xl bg-white/70 text-slate-500 pointer-events-none"
        >
          Cargando flujo...
        </div>

        <div #container class="workflow-canvas"></div>
      </section>
    </div>
  </main>
</div>
