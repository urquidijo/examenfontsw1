<div class="min-h-screen flex items-center justify-center bg-slate-100 px-4">
  <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-lg">
    <h1 class="text-center text-2xl font-bold text-slate-800">
      Invitación al flujo
    </h1>

    <div *ngIf="loading" class="mt-6 text-center text-slate-500">
      Validando invitación...
    </div>

    <div *ngIf="errorMessage && !loading" class="mt-6 text-center text-red-600">
      {{ errorMessage }}
    </div>

    <div *ngIf="inviteData && !loading && !errorMessage" class="mt-6 space-y-4">
      <div class="rounded-2xl bg-slate-50 p-4 text-sm text-slate-700">
        <p><b>Proyecto:</b> {{ inviteData.projectName }}</p>
        <p><b>Nodo:</b> {{ inviteData.nodeLabel }}</p>
      </div>

      <button
        (click)="acceptInvite()"
        [disabled]="accepting"
        class="w-full rounded-xl bg-green-600 px-4 py-2 font-semibold text-white hover:bg-green-700"
      >
        {{ accepting ? 'Aceptando...' : 'Aceptar invitación' }}
      </button>

      <div *ngIf="successMessage" class="text-center text-green-600">
        {{ successMessage }}
      </div>
    </div>
  </div>
</div>
