<h2 mat-dialog-title class="text-xl font-bold text-slate-800">
  {{ data.title }}
</h2>

<div mat-dialog-content class="pt-2 text-sm text-slate-600">
  {{ data.message }}
</div>

<div mat-dialog-actions align="end" class="gap-2 pb-2">
  <button mat-stroked-button type="button" (click)="cancel()">
    {{ data.cancelText || 'Cancelar' }}
  </button>

  <button mat-flat-button color="primary" type="button" (click)="confirm()">
    {{ data.confirmText || 'Aceptar' }}
  </button>
</div>
